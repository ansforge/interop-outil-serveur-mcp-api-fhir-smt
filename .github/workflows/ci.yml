name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # chaque lundi à 6 h UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installation des dépendances
        run: uv sync
      - name: Lint, typage et tests unitaires
        run: ./scripts/check.sh

  # Tests sur l'API réelle du SMT : lancés à la main ou chaque semaine, pour
  # détecter un changement de comportement du serveur sans bloquer les PR.
  integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -m integration
